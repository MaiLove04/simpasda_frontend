<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Jenis Sampah - Web Asri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <div id="alert-container"></div>

    <div class="card border-0 shadow-sm p-4">

     
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Data Jenis Sampah</h3>
                <p class="text-muted mb-0">Kelola jenis sampah dan harga per kilogram</p>
            </div>
            <a href="tambah_jenis_sampah.html" class="btn btn-success">
                + Tambah Jenis Sampah
            </a>
        </div>

       
        <div class="table-responsive">
            <table class="table table-hover align-middle text-center">
                <thead class="table-success">
                    <tr>
                        <th width="70">No</th>
                        <th>Nama Sampah</th>
                        <th>Harga / Kg</th>
                        <th>Status</th>
                        <th width="220">Aksi</th>
                    </tr>
                </thead>
                
                <tbody id="tabel-sampah">
                    <tr>
                        <td colspan="5" class="text-muted py-4">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

    <script src="app.js"></script>

</html>
