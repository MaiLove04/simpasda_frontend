<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak QR Code Nasabah - SIMPASDA</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        .print-card {
            max-width: 400px;
            margin: 50px auto;
            border: 3px dashed #1e521e;
            border-radius: 15px;
            padding: 30px;
        }
        .qr-box {
            background-color: #ffffff;
            padding: 15px;
            display: inline-block;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin: 20px 0;
        }
        .brand-title {
            color: #1e521e;
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        /* CSS Khusus Cetak: Menyembunyikan tombol saat dicetak ke kertas/PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            .print-card {
                margin: 0 auto;
                border: 2px solid #000000; /* Ubah jadi solid saat dicetak agar tegas */
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="container text-center mt-4 no-print">
        <button onclick="window.print()" class="btn btn-success me-2 fw-medium d-inline-flex align-items-center gap-2">
            <i class="fas fa-print"></i> Cetak Sekarang
        </button>
        <button onclick="window.close()" class="btn btn-secondary fw-medium">
            Tutup Halaman
        </button>
    </div>

    <div class="print-card text-center shadow-sm">
        <h4 class="brand-title mb-1">BANK SAMPAH</h4>
        <h5 class="fw-semibold text-muted small mb-3">BASAYAN BESTARI</h5>
        
        <hr style="border-top: 2px solid #1e521e; opacity: 1;">

        <div id="loading" class="py-4">
            <div class="spinner-border text-success" role="status"></div>
            <p class="text-muted small mt-2">Menyiapkan data kartu...</p>
        </div>

        <div id="print-content" class="d-none">
            <div class="qr-box">
                <img id="qr-image" src="" alt="QR Code Nasabah" width="180" height="180">
            </div>

            <h4 class="fw-bold text-dark mb-1" id="nasabah-name">-</h4>
            <span class="badge bg-success fs-6 px-3 py-1.5 rounded-3 mb-3 d-inline-block" id="nasabah-code" style="font-weight: 700;">-</span>
             
            <p class="text-muted mb-0 mx-auto" style="font-size: 11px; max-width: 280px;" id="nasabah-address">
                -
            </p>
        </div>

        <hr class="mt-4 mb-2" style="border-top: 1px dashed #cbd5e1; opacity: 1;">
        <p class="text-muted mb-0" style="font-size: 10px;">Tempel kartu ini di depan rumah untuk memudahkan Kurir SIMPASDA melakukan scan.</p>
    </div>

    <script src="print_qr.js"></script>
</body>
</html>
