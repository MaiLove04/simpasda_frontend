<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Nasabah - Web Asri</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .custom-card {
            border-radius: 12px;
            border: none;
        }
        .thead-custom {
            background-color: #f8fafc;
            color: #475569;
            border-bottom: 2px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <div id="sidebar-container"></div>

        <div class="flex-grow-1 main-content p-4">
            
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <div>
                    <h1 class="h3 mb-1" style="color: #0f172a; font-weight: bold;">Data Nasabah</h1>
                    <p class="text-muted mb-0" style="font-size: 13px;">Kelola akun nasabah, verifikasi status pendaftaran, dan cetak kartu QR Code.</p>
                </div>
                <button class="btn btn-sm btn-light border" style="height: 38px; font-weight: 600;" onclick="window.location.reload();">
                    <i class="fas fa-sync-alt text-success"></i> Refresh
                </button>
            </div>

            <div id="alert-container"></div>

            <div class="card custom-card shadow-sm bg-white">
                
                <div class="d-flex justify-content-between align-items-center px-3 py-3 border-bottom">
                    <h3 class="h6 mb-0" style="color: #0f172a; font-weight: bold;"><i class="fas fa-users me-2 text-muted"></i>Daftar Pemilik Akun</h3>
                    
                    <div style="width: 100%; max-width: 320px;">
                        <div class="d-flex gap-2 mb-0">
                            <div class="input-group input-group-sm" style="border-radius: 6px; overflow: hidden; border: 1px solid #cbd5e1;">
                                <span class="input-group-text bg-white border-0 text-muted pe-1"><i class="fas fa-search" style="font-size: 11px;"></i></span>
                                <input type="text" id="input-search" class="form-control border-0 ps-1" placeholder="Cari nama atau kode nasabah..." style="font-size: 12px; height: 32px;">
                            </div>
                            <button id="btn-clear-search" class="btn btn-sm btn-light border px-2 d-none" style="border-radius: 6px; font-size: 12px; height: 32px;">Reset</button>
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-center" width="100%">
                        <thead class="thead-custom" style="font-size: 13px; font-weight: 600;">
                            <tr>
                                <th class="py-3" width="5%">No</th>
                                <th class="py-3 text-start ps-3" width="18%">Nama Lengkap</th>
                                <th class="py-3 text-start" width="25%">Alamat Rumah</th>
                                <th class="py-3" width="13%">Kode Nasabah</th>
                                <th class="py-3" width="12%">QR Code Kartu</th>
                                <th class="py-3" width="15%">Status Verifikasi</th>
                                <th class="py-3 pe-3" width="12%">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-nasabah" style="color: #334155; font-size: 13px;">
                            <tr>
                                <td colspan="7" class="text-muted py-5">
                                    <div class="spinner-border text-success spinner-border-sm me-2" role="status"></div>
                                    Menghubungkan ke server Simpasda...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="nasabah.js"></script>
</body>
</html>
