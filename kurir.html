<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Kurir - Web Asri</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .custom-card {
            border-radius: 12px;
            border: none;
        }
        .thead-custom {
            background-color: #112d22 !important;
            color: #ffffff !important;
        }
        .avatar-table {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <div id="sidebar-container"></div>

        <div class="flex-grow-1 main-content p-4">
            <div id="alert-container"></div>

            <div class="card custom-card shadow-sm p-4 bg-white">

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                    <div>
                        <h4 class="fw-bold text-dark mb-1">Data Kurir Lapangan</h4>
                        <p class="text-muted small mb-0">Kelola armada kurir penjemputan sampah Basayan Bestari</p>
                    </div>
                    <div>
                        <button type="button" class="btn btn-success px-3 py-2 small" onclick="openKurirModal('add')">
                            <i class="bi bi-plus-lg me-1"></i> Tambah Kurir Baru
                        </button>
                    </div>
                </div>

                <div class="table-responsive rounded-3 shadow-sm border">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead>
                            <tr class="thead-custom">
                                <th width="60" class="py-3 small text-uppercase fw-semibold">No</th>
                                <th width="80" class="py-3 small text-uppercase fw-semibold">Foto</th>
                                <th class="py-3 small text-uppercase fw-semibold text-start">Nama Kurir</th>
                                <th class="py-3 small text-uppercase fw-semibold text-start">Kontak & Email</th>
                                <th class="py-3 small text-uppercase fw-semibold text-start">Alamat</th>
                                <th width="120" class="py-3 small text-uppercase fw-semibold">Status</th>
                                <th width="150" class="py-3 small text-uppercase fw-semibold">Aksi</th>
                            </tr>
                        </thead>
                        
                        <tbody id="tabel-kurir">
                            <tr>
                                <td colspan="7" class="text-muted py-5">
                                    <div class="spinner-border text-success spinner-border-sm me-2" role="status"></div>
                                    Memuat data armada kurir...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="kurirModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="kurirModalLabel" aria-hidden="true">
        <div class="modal-content modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 14px;">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="kurirModalLabel">Form Kurir</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-kurir" enctype="multipart/form-data" novalidate>
                    <div class="modal-body space-y-3">
                        <input type="hidden" id="kurir-id">

                        <div class="mb-3">
                            <label for="name" class="form-label small fw-medium">Nama Lengkap</label>
                            <input type="text" class="form-control form-control-sm" id="name" required placeholder="Masukkan nama kurir">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-medium">Alamat Email</label>
                            <input type="email" class="form-control form-control-sm" id="email" required placeholder="contoh@email.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-medium">Password <span id="pwd-hint" class="text-muted text-xs d-none">(Kosongkan jika tidak ingin diubah)</span></label>
                            <input type="password" class="form-control form-control-sm" id="password" placeholder="Minimal 6 karakter">
                        </div>

                        <div class="mb-3">
                            <label for="no_hp" class="form-label small fw-medium">No. WhatsApp/Telepon</label>
                            <input type="text" class="form-control form-control-sm" id="no_hp" required placeholder="08xxxxxxxxxx">
                        </div>

                        <div class="mb-3">
                            <label for="alamat" class="form-label small fw-medium">Alamat Rumah</label>
                            <textarea class="form-control form-control-sm" id="alamat" rows="2" required placeholder="Tulis alamat domisili kurir"></textarea>
                        </div>

                        <div class="mb-3" id="wrapper-bank-sampah">
                            <label for="bank_sampah_id" class="form-label small fw-medium">Penempatan Bank Sampah</label>
                            <select class="form-select form-select-sm" id="bank_sampah_id" required>
                                <option value="1" selected>Bank Sampah Pusat (Default)</option>
                                </select>
                        </div>

                        <div class="mb-2">
                            <label for="foto" class="form-label small fw-medium">Foto Profil</label>
                            <input type="file" class="form-control form-control-sm" id="foto" accept="image/png, image/jpeg, image/jpg">
                            <div class="form-text text-xs">Format JPG/PNG, Maksimal 2MB.</div>
                        </div>
                    </div>
                    
                    <div class="modal-footer border-top-0 pt-0">
                        <button type="button" class="btn btn-light px-3 py-2 small" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-success px-4 py-2 small" id="btn-submit-kurir">Simpan Data</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script src="kurir.js"></script>
</body>
</html>
