<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Kurir - Web Asri</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .custom-card {
            border-radius: 12px;
            border: none;
        }
        .thead-custom {
            background-color: #112d22 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <div id="sidebar-container"></div>

        <div class="flex-grow-1 main-content p-4">
            <div id="alert-container"></div>

            <div class="card custom-card shadow-sm p-4 bg-white">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4 class="fw-bold text-dark mb-1">Data Kurir Lapangan</h4>
                        <p class="text-muted small mb-0">Kelola armada kurir armada penjemputan sampah Basayan Bestari</p>
                    </div>
                </div>

                <div class="table-responsive rounded-3">
                    <table class="table table-hover align-middle text-center mb-0">
                        <thead>
                            <tr class="thead-custom">
                                <th width="70" class="py-3 small text-uppercase tracking-wider fw-semibold">No</th>
                                <th class="py-3 small text-uppercase tracking-wider fw-semibold">Nama Kurir</th>
                                <th class="py-3 small text-uppercase tracking-wider fw-semibold">Email</th>
                                <th class="py-3 small text-uppercase tracking-wider fw-semibold">No. Telepon</th>
                                <th class="py-3 small text-uppercase tracking-wider fw-semibold">Status Akun</th>
                                <th width="150" class="py-3 small text-uppercase tracking-wider fw-semibold">Aksi</th>
                            </tr>
                        </thead>
                        
                        <tbody id="tabel-kurir">
                            <tr>
                                <td colspan="6" class="text-muted py-5">
                                    <div class="spinner-border text-success spinner-border-sm me-2" role="status"></div>
                                    Memuat data armada kurir...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <script src="kurir.js"></script>
</body>
</html>
