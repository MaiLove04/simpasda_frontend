<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SIMPASDA</title>
    
    <!-- Bootstrap Modern v5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Wajib untuk ikon profesional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 12px;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
        .topbar {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            height: 70px;
        }
    </style>
</head>
<body>

    <div class="d-flex">
        <!-- Tempat Navbar Samping Muncul -->
        <div id="sidebar-container"></div>

        <!-- Area Konten Utama -->
        <div class="flex-grow-1 main-content d-flex flex-column">
            
            <!-- TOPBAR/HEADER ATAS -->
            <header class="topbar d-flex align-items-center justify-content-between px-4 sticky-top">
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted fw-medium d-none d-sm-inline">Sistem Informasi Pengelolaan Sampah Daerah</span>
                </div>
                <!-- Dropdown Profil/User -->
                <div class="dropdown">
                    <div class="d-flex align-items-center gap-3" data-bs-toggle="dropdown" style="cursor: pointer;">
                        <div class="text-end d-none d-md-block">
                            <h6 class="fw-semibold mb-0 small text-dark">Administrator</h6>
                            <span class="text-muted p-0 small" style="font-size: 11px;">Main Admin</span>
                        </div>
                        <div class="icon-box bg-success-subtle text-success rounded-circle" style="width: 40px; height: 40px;">
                            <i class="bi bi-person-fill fs-5"></i>
                        </div>
                    </div>
                </div>
            </header>

            <!-- ISI KONTEN UTAMA DASHBOARD -->
            <main class="p-4 flex-grow-1">
                <div class="row align-items-center mb-4">
                    <div class="col">
                        <h4 class="fw-bold text-dark mb-1">Dashboard Overview</h4>
                        <p class="text-muted small mb-0">Ringkasan data Bank Sampah Basayan Bestari saat ini</p>
                    </div>
                </div>

                <!-- Grid Kartu Ringkasan (Cards Modern) -->
                <div class="row g-4">
                    
                    <!-- KARTU NASABAH -->
                    <div class="col-12 col-sm-6 col-xl-4">
                        <div class="card border-0 shadow-sm p-4 bg-white stat-card">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-semibold small text-uppercase mb-2" style="letter-spacing: 0.5px;">Total Nasabah</h6>
                                    <h2 class="fw-bold text-dark mb-0" id="total-nasabah">0</h2>
                                </div>
                                <div class="icon-box bg-success-subtle text-success">
                                    <i class="bi bi-people-fill fs-4"></i>
                                </div>
                            </div>
                            <div class="mt-3">
                                <span class="text-success small fw-medium">
                                    <i class="bi bi-shield-check me-1"></i> Terverifikasi
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- KARTU KURIR -->
                    <div class="col-12 col-sm-6 col-xl-4">
                        <div class="card border-0 shadow-sm p-4 bg-white stat-card">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-semibold small text-uppercase mb-2" style="letter-spacing: 0.5px;">Total Kurir</h6>
                                    <h2 class="fw-bold text-dark mb-0" id="total-kurir">0</h2>
                                </div>
                                <div class="icon-box bg-primary-subtle text-primary">
                                    <i class="bi bi-truck fs-4"></i>
                                </div>
                            </div>
                            <div class="mt-3">
                                <span class="text-primary small fw-medium">
                                    <i class="bi bi-geo-alt-fill me-1"></i> Tim Lapangan
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- KARTU TRANSAKSI -->
                    <div class="col-12 col-xl-4">
                        <div class="card border-0 shadow-sm p-4 bg-white stat-card">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="text-muted fw-semibold small text-uppercase mb-2" style="letter-spacing: 0.5px;">Total Transaksi</h6>
                                    <h2 class="fw-bold text-dark mb-0" id="total-transaksi">0</h2>
                                </div>
                                <div class="icon-box bg-warning-subtle text-warning">
                                    <i class="bi bi-arrow-left-right fs-4"></i>
                                </div>
                            </div>
                            <div class="mt-3">
                                <span class="text-warning small fw-medium">
                                    <i class="bi bi-clock-history me-1"></i> Setoran & Mutasi
                                </span>
                            </div>
                        </div>
                    </div>

                </div>
            </main>

        </div>
    </div>

    <!-- Bootstrap Bundle JS (wajib untuk fungsi dropdown profil) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
