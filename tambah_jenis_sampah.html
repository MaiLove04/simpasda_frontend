<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Jenis Sampah - SIMPASDA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .main-content { background-color: #f8f9fa; min-height: 100vh; }
        .custom-card { border-radius: 12px; border: none; }
    </style>
</head>
<body>
    <div class="d-flex">
        <div id="sidebar-container"></div>
        <div class="flex-grow-1 main-content p-4">
            <div class="card custom-card shadow-sm p-4 bg-white" style="max-width: 600px; margin: 0 auto;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold text-dark mb-0">Tambah Jenis Sampah</h4>
                    <a href="jenis_sampah.html" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Kembali
                    </a>
                </div>
                <form id="form-tambah-sampah">
                    <input type="hidden" id="bank_sampah_id">
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-medium small text-muted">Nama Sampah</label>
                        <input type="text" class="form-control" id="nama" required placeholder="Contoh: Kertas Kardus">
                    </div>
                    <div class="mb-3">
                        <label for="kode_icon" class="form-label fw-medium small text-muted">Kode Icon</label>
                        <input type="text" class="form-control" id="kode_icon" required placeholder="Contoh: bi bi-trash">
                    </div>
                    <div class="mb-3">
                        <label for="harga_per_kg" class="form-label fw-medium small text-muted">Harga per Kg (Rp)</label>
                        <input type="number" class="form-control" id="harga_per_kg" required placeholder="Contoh: 3000">
                    </div>
                    <div class="mb-4">
                        <label for="status" class="form-label fw-medium small text-muted">Status</label>
                        <select class="form-select" id="status" required>
                            <option value="aktif">Aktif</option>
                            <option value="nonaktif">Nonaktif</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success w-100 fw-medium" id="btn-submit">
                            <i class="bi bi-floppy"></i> Simpan Data
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="tambah_jenis_sampah.js"></script>
</body>
</html>
