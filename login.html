<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIMPASDA Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card border-0 shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <div class="text-center mb-4">
        <h3 class="fw-bold">SIMPASDA Admin</h3>
        <p class="text-muted">Silakan masuk ke akun Anda</p>
    </div>

    <div id="error-alert" class="alert alert-danger d-none"></div>

    <form id="form-login">
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required placeholder="nama@email.com">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-success w-100" id="btn-submit">Masuk</button>
    </form>
</div>

    <script src="login.js"></script>
</body>
</html>
